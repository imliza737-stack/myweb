<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shapes Layout</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background:#a0dcde;
      font-family:arial, sans-serif; 
    }

    .a {
      width: 350px;
      height: 180px;
      background: #d2acb6;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
    }

    .b {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 25px;
    }

    .c {
      width: 58px;
      height: 28px;
      background: #8cd2d5;
    }

    .d {
      width: 58px;
    }

    .e{
      width: 28px;
      height: 28px;
      background: #9cbe57;
    }
  </style>
</head>

<body>

  <div class="a">

   
    <div class="b">
      <div class="c"></div>
      <div class="e"></div>
    </div>

    
    <div class="b">
      <div class="e"></div>
      <div class="c"></div>
    </div>


    <div class="b">
      <div class="c"></div>
      <div class="c"></div>
      <div class="c"></div>
    </div>

  </div>

</body>
</html>
